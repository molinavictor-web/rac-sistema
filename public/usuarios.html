<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAC Monagas — Usuarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="shell"></div>
  <div class="modal-fondo" id="modalFondo">
    <div class="modal">
      <h2 style="margin-bottom:16px;">Nuevo usuario</h2>
      <div class="error-msg" id="errorModal"></div>
      <form id="formUsuario">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required>
        </div>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="6">
        </div>
        <div class="campo">
          <label for="rol">Rol</label>
          <select id="rol" required>
            <option value="operador">Operador</option>
            <option value="encargado_municipio">Encargado de municipio</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="campo" id="campoMunicipio" style="display:none;">
          <label for="municipio_id">ID del municipio</label>
          <input type="number" id="municipio_id" min="1">
        </div>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="submit" class="btn btn-primario" id="btnGuardar">Crear usuario</button>
          <button type="button" class="btn btn-fantasma" id="btnCancelar">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/usuarios.js"></script>
</body>
</html>
