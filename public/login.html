<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAC · Sistema — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-decoration login-decoration-one"></div>
    <div class="login-decoration login-decoration-two"></div>

    <div class="login-layout">
      <section class="login-brand-panel">
        <div class="login-brand-mark">RAC</div>
        <span class="login-eyebrow">MONAGAS · EDUCACIÓN</span>
        <h1>RAC · Sistema</h1>
        <p class="login-brand-title">Registro de Asignación de Cargos</p>
        <p class="login-brand-copy">Plataforma para la gestión, validación y control de la información del personal y planteles educativos.</p>
        <div class="login-brand-lines">
          <span></span><span></span><span></span>
        </div>
      </section>

      <div class="login-card">
        <div class="login-card-head">
          <span class="login-sello">Acceso seguro</span>
          <h2>Bienvenido</h2>
          <p class="login-sub">Inicia sesión para continuar al sistema.</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="formLogin">
          <div class="campo">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" required autocomplete="username" placeholder="usuario@ejemplo.com">
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primario btn-ancho login-submit" id="btnEntrar">
            <span>Iniciar sesión</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <div class="login-footer">RAC · Registro de Asignación de Cargos</div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
