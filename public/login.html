<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervisión — RAC Monagas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  body{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--surface-2, #f2f5fa); margin:0;}
  .login-card{width:100%; max-width:380px; background:#fff; border-radius:14px; box-shadow:0 10px 30px rgba(20,30,60,.08); padding:32px 28px;}
  .login-card h1{font-family:"Space Grotesk", sans-serif; font-size:1.3rem; margin:0 0 4px;}
  .login-card p{color:var(--muted); font-size:.85rem; margin:0 0 24px;}
  .login-card label{display:block; font-size:.8rem; font-weight:600; margin-bottom:6px; margin-top:16px;}
  .login-card input{width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:.95rem;}
  .login-card button{width:100%; margin-top:22px; padding:11px; border:0; border-radius:8px; background:var(--navy-900, #1a2b4c); color:#fff; font-weight:600; cursor:pointer; font-size:.95rem;}
  .login-card button:disabled{opacity:.6; cursor:default;}
  .login-error{margin-top:14px; font-size:.82rem; color:#b3261e; display:none;}
  .login-error.visible{display:block;}
</style>
</head>
<body>
  <div class="login-card">
    <h1>Módulo Supervisión</h1>
    <p>Zona Educativa de Monagas — acceso para el equipo de Supervisión y directores de plantel.</p>
    <form id="formLogin">
      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="btnEntrar">Entrar</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/supervision-login.js"></script>
</body>
</html>
