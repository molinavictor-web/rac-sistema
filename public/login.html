<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAC Monagas — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <span class="login-sello">Secretaría de Educación · Monagas</span>
      <h1>Registro de Asignación de Carga</h1>
      <p class="login-sub">Inicia sesión para continuar.</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="formLogin">
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primario btn-ancho" id="btnEntrar">Entrar</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
