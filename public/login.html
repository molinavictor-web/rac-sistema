<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAC Monagas — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M8 7h8M8 10h7"/></svg></div>
        <div><div class="login-brand-title">RAC · Sistema</div><div class="login-brand-sub">Registro de Asignación de Cargos</div></div>
      </div>
      <span class="login-sello">Monagas · Educación</span>
      <h1>Bienvenido</h1>
      <p class="login-sub">Inicia sesión para acceder al sistema de gestión educativa.</p>
      <div class="error-msg" id="errorMsg"></div>
      <form id="formLogin">
        <div class="campo"><label for="email">Correo</label><input type="email" id="email" required autocomplete="username" placeholder="usuario@educacion.gob.ve"></div>
        <div class="campo"><label for="password">Contraseña</label><input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"></div>
        <button type="submit" class="btn btn-primario btn-ancho" id="btnEntrar">Ingresar al sistema</button>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
