<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAC Monagas — Consulta de planteles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* ================================================================
     REDISEÑO — CONSULTA DE PLANTELES / GESCOLAR
     Todo queda encapsulado en .planteles-consulta-page para no afectar
     el resto del sistema. La lógica de datos continúa en JS.
     ================================================================ */
  .planteles-consulta-page{display:flex;flex-direction:column;gap:18px;}
  .pc-hero{position:relative;overflow:hidden;border:1px solid var(--rac-border,#dfe7f0);border-radius:18px;background:linear-gradient(135deg,#0d2b52 0%,#123f73 62%,#1677e8 100%);box-shadow:0 10px 30px rgba(13,43,82,.13);color:#fff;padding:26px 28px;}
  .pc-hero:after{content:"";position:absolute;width:240px;height:240px;right:-70px;top:-95px;border:1px solid rgba(255,255,255,.14);border-radius:50%;box-shadow:0 0 0 36px rgba(255,255,255,.035),0 0 0 72px rgba(255,255,255,.025);}
  .pc-hero-content{position:relative;z-index:1;max-width:760px;}
  .pc-kicker{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b9d9ff;}
  .pc-kicker-dot{width:7px;height:7px;border-radius:50%;background:#70c7ff;box-shadow:0 0 0 5px rgba(112,199,255,.14);}
  .pc-hero h2{margin:0 0 7px;font-size:26px;line-height:1.15;color:#fff;letter-spacing:-.02em;}
  .pc-hero p{margin:0;color:#dbeaff;font-size:14px;line-height:1.55;max-width:680px;}

  .pc-search-panel{background:#fff;border:1px solid var(--rac-border,#dfe7f0);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(13,43,82,.055);}
  .pc-search-row{display:flex;gap:10px;align-items:flex-end;}
  .pc-search-field{flex:1;min-width:0;}
  .pc-search-label{display:block;margin:0 0 7px;font-size:12px;font-weight:700;color:#3f526c;}
  .pc-search-input-wrap{position:relative;display:flex;align-items:center;}
  .pc-search-icon{position:absolute;left:14px;color:#7890aa;font-size:17px;pointer-events:none;line-height:1;}
  .pc-search-input{width:100%;height:46px!important;padding:0 44px 0 40px!important;border:1px solid #cfdbe8!important;border-radius:11px!important;background:#f9fbfd!important;color:#10233e!important;font-size:14px!important;box-sizing:border-box;outline:none;transition:.18s ease;}
  .pc-search-input:focus{border-color:#1677e8!important;box-shadow:0 0 0 4px rgba(22,119,232,.10)!important;background:#fff!important;}
  .pc-clear{position:absolute;right:9px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#8090a5;cursor:pointer;font-size:16px;}
  .pc-clear:hover{background:#edf4fb;color:#123f73;}
  .pc-refresh{height:46px;white-space:nowrap;}

  .pc-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;min-height:20px;}
  .pc-results-count{font-size:12px;color:#718198;}
  .pc-hint{font-size:11px;color:#8a99ab;text-align:right;}

  .pc-results{background:#fff;border:1px solid var(--rac-border,#dfe7f0);border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(13,43,82,.045);}
  .pc-results-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 19px;border-bottom:1px solid #e8eef5;}
  .pc-results-head h3{margin:0;font-size:15px;color:#10233e;}
  .pc-results-head span{font-size:11px;color:#8190a3;}
  .pc-table-wrap{overflow:auto;}
  .pc-table{width:100%;border-collapse:collapse;min-width:820px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .pc-table th{padding:11px 14px;background:#f7f9fc;border-bottom:1px solid #e2e9f1;color:#6b7b90;font-size:10px;text-transform:uppercase;letter-spacing:.06em;text-align:left;white-space:nowrap;}
  .pc-table td{padding:13px 14px;border-bottom:1px solid #edf1f5;color:#30435b;font-size:12.5px;vertical-align:middle;}
  .pc-table tbody tr{transition:background .14s ease;}
  .pc-table tbody tr:hover{background:#f7fbff;}
  .pc-table tbody tr:last-child td{border-bottom:0;}
  .pc-code{display:inline-flex;align-items:center;padding:5px 8px;border-radius:7px;background:#eef5fd;color:#174f87;font:600 11px var(--carnet,monospace);white-space:nowrap;}
  .pc-plantel-name{font-weight:600;color:#173451;max-width:330px;}
  .pc-muted{color:#8090a5;}
  .pc-action{white-space:nowrap;}
  .pc-view-btn{display:inline-flex;align-items:center;gap:6px;}

  .pc-empty{padding:52px 24px;text-align:center;}
  .pc-empty-icon{width:46px;height:46px;display:grid;place-items:center;margin:0 auto 12px;border-radius:13px;background:#eef5fd;color:#1677e8;font-size:20px;}
  .pc-empty strong{display:block;margin-bottom:5px;color:#173451;font-size:14px;}
  .pc-empty span{display:block;max-width:560px;margin:auto;color:#7b8ba0;font-size:12px;line-height:1.55;}
  .pc-loading{padding:52px 24px;text-align:center;color:#718198;font-size:13px;}
  .pc-loading-dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#1677e8;animation:pcPulse 1s infinite alternate;}
  @keyframes pcPulse{from{opacity:.35;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

  /* Ficha completa */
  #modalFichaFondo{z-index:999;display:none;position:fixed;inset:0;background:rgba(5,19,36,.62);backdrop-filter:blur(3px);}
  #modalFichaFondo.visible{display:block;}
  #modalFichaFondo .pc-ficha-modal{position:absolute;inset:18px;display:flex;flex-direction:column;overflow:hidden;background:#f5f8fc;border:1px solid rgba(255,255,255,.65);border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.28);}
  .pc-ficha-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 22px;background:#fff;border-bottom:1px solid #e1e8f0;flex:0 0 auto;}
  .pc-ficha-heading{display:flex;align-items:center;gap:13px;min-width:0;}
  .pc-ficha-emblem{width:42px;height:42px;display:grid;place-items:center;flex:0 0 auto;border-radius:12px;background:linear-gradient(145deg,#e9f4ff,#d9eaff);color:#0d4f8f;font-size:20px;}
  .pc-ficha-title{min-width:0;}
  .pc-ficha-title h2{margin:0 0 3px;color:#10233e;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pc-ficha-title p{margin:0;color:#77879a;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pc-close{height:38px;white-space:nowrap;}
  .pc-ficha-scroll{flex:1 1 auto;overflow:auto;padding:20px 22px 28px;}
  .pc-section{margin-bottom:20px;}
  .pc-section:last-child{margin-bottom:0;}
  .pc-section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .pc-section-head h3{margin:0;color:#173451;font-size:14px;}
  .pc-section-head span{font-size:10px;color:#8291a4;}
  .pc-highlight-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
  .pc-highlight{padding:13px 14px;background:#fff;border:1px solid #e1e8f0;border-radius:12px;min-width:0;box-shadow:0 3px 12px rgba(13,43,82,.035);}
  .pc-highlight-label{margin-bottom:6px;color:#8090a4;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .pc-highlight-value{color:#173451;font-size:12.5px;font-weight:600;line-height:1.4;overflow-wrap:anywhere;}
  .pc-data-card{background:#fff;border:1px solid #e1e8f0;border-radius:12px;overflow:hidden;}
  .pc-data-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
  .pc-data-item{padding:12px 14px;border-right:1px solid #edf1f5;border-bottom:1px solid #edf1f5;min-width:0;}
  .pc-data-item:nth-child(3n){border-right:0;}
  .pc-data-label{margin-bottom:4px;color:#8492a4;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;overflow-wrap:anywhere;}
  .pc-data-value{color:#30435b;font-size:11.5px;line-height:1.45;overflow-wrap:anywhere;}

  .pc-drive{background:#fff;border:1px solid #e1e8f0;border-radius:12px;overflow:hidden;}
  .pc-drive-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid #edf1f5;background:#fbfcfe;}
  .pc-drive-toolbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
  .pc-drive-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;background:#eaf4ff;color:#1677e8;font-size:10px;font-weight:700;}
  .pc-drive-list{padding:9px;}
  .pc-drive-file{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid transparent;border-radius:9px;}
  .pc-drive-file:hover{background:#f7faff;border-color:#e1ebf5;}
  .pc-file-icon{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border-radius:9px;background:#eef5fd;color:#1677e8;font-size:15px;}
  .pc-file-info{min-width:0;flex:1;}
  .pc-file-name{color:#30435b;font-size:11.5px;font-weight:600;overflow-wrap:anywhere;}
  .pc-file-meta{margin-top:2px;color:#8795a7;font-size:10px;}
  .pc-upload{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .pc-upload-status{color:#718198;font-size:10px;}

  @media(max-width:1050px){
    .pc-highlight-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media(max-width:820px){
    .pc-hero{padding:22px 20px;}
    .pc-search-row{align-items:stretch;flex-direction:column;}
    .pc-refresh{width:100%;}
    .pc-meta{align-items:flex-start;flex-direction:column;}
    .pc-hint{text-align:left;}
    .pc-highlight-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .pc-data-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .pc-data-item:nth-child(3n){border-right:1px solid #edf1f5;}
    .pc-data-item:nth-child(2n){border-right:0;}
    #modalFichaFondo .pc-ficha-modal{inset:8px;border-radius:14px;}
    .pc-ficha-top{padding:14px 15px;}
    .pc-ficha-scroll{padding:16px 15px 22px;}
  }
  @media(max-width:560px){
    .pc-hero h2{font-size:22px;}
    .pc-highlight-grid,.pc-data-grid{grid-template-columns:1fr;}
    .pc-data-item:nth-child(n){border-right:0;}
    .pc-ficha-title h2{font-size:15px;}
    .pc-ficha-title p{max-width:190px;}
  }
</style>
</head>
<body>
  <div id="shell"></div>

  <div class="modal-fondo" id="modalFichaFondo" role="dialog" aria-modal="true" aria-labelledby="fichaTitulo">
    <div class="pc-ficha-modal">
      <header class="pc-ficha-top">
        <div class="pc-ficha-heading">
          <div class="pc-ficha-emblem" aria-hidden="true">🏫</div>
          <div class="pc-ficha-title">
            <h2 id="fichaTitulo">Ficha del plantel</h2>
            <p id="fichaSubtitulo">Información institucional</p>
          </div>
        </div>
        <button type="button" class="btn btn-fantasma btn-sm pc-close" id="btnCerrarFicha" aria-label="Cerrar ficha del plantel">Cerrar ✕</button>
      </header>
      <div id="fichaContenido" class="pc-ficha-scroll"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/planteles-consulta.js"></script>
</body>
</html>
