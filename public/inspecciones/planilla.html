<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SID — Inspecciones · Planilla de materiales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .pl-cab { padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 18px; }
  .pl-cab .campo { margin-bottom: 0; }
  .pl-cab .ancho { grid-column: 1 / -1; }
  .pl-cab textarea { width: 100%; min-height: 70px; padding: 9px 12px; border: 1px solid var(--borde); border-radius: var(--radio, 8px); resize: vertical; }
  .pl-datos-titulo { padding: 14px 20px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .pl-editado { color: #b7791f; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .pl-ing { display: grid; gap: 8px; }
  .pl-ing input { width: 100%; }
  .pl-ing-fila { display: flex; gap: 8px; align-items: center; }
  .pl-ing-fila .orden { font-size: .72rem; font-weight: 700; color: var(--rac-muted, #718198); min-width: 78px; }
  .pl-membrete { padding: 0 20px 16px; }
  .pl-membrete summary { cursor: pointer; color: var(--rac-muted, #718198); font-size: .8rem; }
  .pl-membrete dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 18px; margin: 10px 0 0; font-size: .8rem; }
  .pl-membrete dt { color: var(--rac-muted, #718198); font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; }
  .pl-membrete dd { margin: 0 0 4px; }
  .pl-aviso { margin: 0 0 16px; padding: 12px 16px; border-radius: 10px; font-size: .85rem; display: none; }
  .pl-aviso.visible { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .pl-aviso.info { background: #eaf4ff; color: #0d2b52; }
  .pl-aviso.alerta { background: #fefcbf; color: #744210; }
  .pl-cap { margin: 0; border-top: 1px solid var(--borde); }
  .pl-cap > summary { cursor: pointer; padding: 11px 20px; font-weight: 600; background: var(--papel, #f4f7fb); display: flex; justify-content: space-between; gap: 10px; }
  .pl-cap > summary small { font-weight: 500; color: var(--rac-muted, #718198); }
  .pl-tabla td, .pl-tabla th { vertical-align: middle; }
  .pl-tabla .nro { width: 46px; text-align: center; color: var(--rac-muted, #718198); font-size: .78rem; }
  .pl-tabla .uni { width: 90px; font-size: .78rem; color: var(--rac-muted, #718198); white-space: nowrap; }
  .pl-tabla .can { width: 118px; }
  .pl-tabla input.cant { width: 100%; text-align: right; padding: 7px 9px; border: 1px solid var(--borde); border-radius: 8px; font-family: var(--mono, "IBM Plex Mono", monospace); }
  .pl-tabla tr.cambiada td { background: #fffbea; }
  .pl-tabla tr.cambiada input.cant { border-color: #d69e2e; }
  .pl-tabla input.cant.malo { border-color: #df3944; background: #fff5f5; }
  .pl-tabla tr.oculta { display: none; }
  .pl-barra { position: sticky; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid var(--borde); box-shadow: 0 -6px 18px rgba(13,43,82,.08); padding: 10px 20px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .pl-barra .estado { font-size: .82rem; color: var(--rac-muted, #718198); }
  .pl-barra .estado.sucio { color: #b7791f; font-weight: 600; }
  .pl-barra .estado.malo { color: #c53030; font-weight: 600; }
  .pl-adic { margin-top: 14px; border-top: 4px solid #e8740c; border-left: 6px solid #e8740c; background: #fff7ed; padding: 18px 20px 20px; }
  .pl-adic h3 { color: #9a3d00; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pl-adic-chip { background: #e8740c; color: #fff; font-size: .66rem; font-weight: 700; letter-spacing: .04em; padding: 3px 9px; border-radius: 99px; text-transform: uppercase; }
  .pl-adic .pl-tabla th { background: #ffedd5; color: #7c2d00; }
  .pl-adic .pl-tabla td { background: #fff; }
  .pl-adic .pl-adic-buscar input { border-color: #f0b27a; background: #fff; }
  .pl-adic .pl-adic-buscar input:focus { outline: 2px solid #e8740c; border-color: #e8740c; }
  .pl-adic-buscar { position: relative; max-width: 560px; margin-bottom: 14px; }
  .pl-adic-buscar input { width: 100%; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 8px; }
  .pl-sug { display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 30; background: #fff; border: 1px solid var(--borde); border-radius: 8px; box-shadow: 0 10px 28px rgba(13,43,82,.16); margin-top: 4px; max-height: 340px; overflow: auto; }
  .pl-sug.abierta { display: block; }
  .pl-sug-item { display: flex; width: 100%; justify-content: space-between; gap: 10px; text-align: left; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--borde); background: #fff; cursor: pointer; font: inherit; }
  .pl-sug-item:hover, .pl-sug-item:focus { background: #eaf4ff; }
  .pl-sug-item small { color: var(--rac-muted, #718198); white-space: nowrap; }
  .pl-sug-item em { color: #b7791f; font-size: .75rem; }
  .pl-sug-crear { color: #0d4a9c; font-weight: 600; }
  .pl-sug-vacio { padding: 12px; color: var(--rac-muted, #718198); font-size: .85rem; }
  .pl-crear { padding: 12px; display: grid; gap: 8px; }
  .pl-crear label { display: grid; gap: 3px; font-size: .78rem; color: var(--rac-muted, #718198); }
  .pl-crear input { padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; font-size: .9rem; }
  .pl-crear-botones { display: flex; gap: 8px; }
  .pl-crear-error { color: #c53030; font-size: .8rem; }
  .pl-adic-vacio { color: var(--rac-muted, #718198); font-size: .85rem; padding: 6px 0; }
  .pl-adic-tabla .quitar { width: 54px; text-align: center; }
  .pl-pend { background: #fefcbf; color: #744210; font-size: .68rem; font-weight: 600; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
  @media (max-width: 600px) {
    .pl-tabla .uni { display: none; }
    .pl-tabla .can { width: 104px; }
  }
</style>
</head>
<body class="planteles-page">
  <div id="shell"></div>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/inspecciones-planilla.js"></script>
</body>
</html>
