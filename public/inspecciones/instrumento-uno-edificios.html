<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SID — Inspecciones · Edificios compartidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .iu-nueva{padding:18px 20px;}
  .iu-nueva form{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .iu-nueva label{display:block; font-weight:600; font-size:.9rem; margin-bottom:5px;}
  .iu-nueva input{padding:11px 12px; border:1px solid #c7d2e0; border-radius:9px; font:inherit; font-size:1rem; min-width:220px;}
  .iu-etq{display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:99px;}
  .iu-etq.borrador{background:#fff4e5; color:#b45f06;} .iu-etq.enviada{background:#eaf9f2; color:#0f7a4c;}
  .iu-tarjetas{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:14px;}
  .iu-edif{padding:14px 18px; margin-bottom:12px;}
  .iu-edif h3{margin:0 0 4px; font-family:var(--display); font-size:1rem;}
  .iu-edif ul{margin:6px 0 0; padding-left:20px; font-size:.9rem;}
  .iu-edif small{color:#718198;}
</style>
</head>
<body class="planteles-page">
  <div id="shell"></div>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/instrumento-uno-edificios.js"></script>
</body>
</html>
