<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SID — Inspecciones · Solicitud de dotación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .dt-num { text-align: right; font-family: var(--mono, "IBM Plex Mono", monospace); }
  .dt-bloque { background: #16233d; color: #fff; font-weight: 600; padding: 8px 14px; }
  .dt-tabla { width: 100%; border-collapse: collapse; font-size: .86rem; }
  .dt-tabla th, .dt-tabla td { padding: 6px 10px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  .dt-tabla th { background: #f4f7fb; font-size: .72rem; text-transform: uppercase; text-align: left; }
  .dt-tabla input[type=text] { width: 110px; padding: 6px 8px; border: 1px solid var(--borde); border-radius: 6px; text-align: right; }
  .dt-tabla input[type=text]:disabled { background: #f0f2f5; }
  .dt-cab { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; padding: 16px 20px; }
  .dt-cab label { display: grid; gap: 3px; font-size: .76rem; color: var(--rac-muted, #718198); }
  .dt-cab input, .dt-cab textarea { padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; font-size: .9rem; font-family: inherit; }
  .dt-cab .ancho { grid-column: 1 / -1; }
  .dt-barra { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--borde); padding: 10px 20px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; z-index: 5; }
  .dt-retirado { color: #a0aec0; font-size: .7rem; }
  .dt-fondo { position: fixed; inset: 0; background: rgba(13,43,82,.45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dt-modal { background: #fff; border-radius: 12px; padding: 20px; width: min(760px, 100%); display: grid; gap: 12px; max-height: 90vh; overflow: auto; }
  .dt-scroll { overflow: auto; max-height: 70vh; border-top: 1px solid var(--borde); }
  .dt-scroll thead th { position: sticky; top: 0; z-index: 2; }
</style>
</head>
<body class="planteles-page">
  <div id="shell"></div>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/inspecciones-dotacion.js"></script>
</body>
</html>
