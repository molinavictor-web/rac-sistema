<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SID — Inspecciones · Infraestructuras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .inf-tarjetas{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:14px;}
  .inf-barra{height:10px; background:#e6ecf4; border-radius:99px; overflow:hidden; margin-top:6px;}
  .inf-barra > span{display:block; height:100%; background:#1f6feb; border-radius:99px;}
  .inf-etq{display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:99px; white-space:nowrap;}
  .inf-etq.sin{background:#f1f3f6; color:#5b6b80;} .inf-etq.solo{background:#eaf3ff; color:#1b5fc4;} .inf-etq.comparte{background:#eaf9f2; color:#0f7a4c;}
  .inf-filtros{padding:14px 20px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .inf-filtros input, .inf-filtros select{padding:9px 12px; border:1px solid #c7d2e0; border-radius:9px; font:inherit;}
  .inf-pag{display:flex; gap:10px; align-items:center; justify-content:center; padding:12px;}
  .inf-fondo{position:fixed; inset:0; background:rgba(15,25,40,.45); z-index:50; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:24px 12px;}
  .inf-modal{background:#fff; border-radius:14px; width:100%; max-width:640px; padding:20px 22px; box-shadow:0 18px 50px rgba(0,0,0,.25);}
  .inf-modal h2{margin:0 0 2px; font-family:var(--display); font-size:1.15rem;}
  .inf-modal .sub{color:#5b6b80; font-size:.88rem; margin-bottom:12px;}
  .inf-opcion{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid #c7d2e0; border-radius:10px; margin-bottom:8px; cursor:pointer;}
  .inf-opcion input{margin-top:4px;}
  .inf-opcion.activa{border-color:#1f6feb; background:#f3f8ff;}
  .inf-lista{list-style:none; margin:8px 0; padding:0;}
  .inf-lista li{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 10px; border:1px solid #e3e9f1; border-radius:8px; margin-bottom:6px; font-size:.9rem;}
  .inf-res{border:1px solid #c7d2e0; border-radius:9px; margin-top:4px; max-height:230px; overflow-y:auto;}
  .inf-res button{display:block; width:100%; text-align:left; background:#fff; border:0; border-bottom:1px solid #eef2f7; padding:8px 10px; font:inherit; cursor:pointer;}
  .inf-res button:hover{background:#f3f8ff;}
  .inf-res small{color:#718198;}
  .inf-aviso{padding:9px 12px; border-radius:9px; background:#fff8e1; border:1px solid #f2c94c; font-size:.84rem; margin:8px 0;}
  .inf-error{color:#b3261e; font-size:.88rem; margin-top:8px;}
  .inf-acciones{display:flex; gap:10px; justify-content:flex-end; margin-top:14px;}
  code.infra{font-family:'IBM Plex Mono',monospace; font-size:.85em;}
</style>
</head>
<body class="planteles-page">
  <div id="shell"></div>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/infraestructuras.js"></script>
</body>
</html>
