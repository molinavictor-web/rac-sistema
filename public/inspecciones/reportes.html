<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SID — Inspecciones · Reportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .rep-panel{padding:16px 20px;}
  .rep-fila{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .rep-fila select{padding:9px 12px; border:1px solid #c7d2e0; border-radius:9px; font:inherit; min-width:260px; max-width:100%;}
  .rep-presets{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px;}
  .rep-chip{border:1px solid #c7d2e0; background:#fff; border-radius:99px; padding:6px 13px; font:inherit; font-size:.84rem; cursor:pointer;}
  .rep-chip:hover{background:#f3f8ff;}
  .rep-sugerencias{display:flex; flex-direction:column; gap:4px; margin:6px 0;}
  .rep-sug{display:flex; flex-direction:column; text-align:left; border:1px solid #d5deea; background:#fff; border-radius:8px; padding:7px 11px; font:inherit; cursor:pointer;}
  .rep-sug:hover{background:#f3f8ff;}
  .rep-sug span{font-size:.8rem; color:#5b6b80;}
  .rep-elegidos{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0;}
  .rep-nota{font-size:.84rem; color:#5b6b80; width:100%;}
  .rep-pastilla{display:inline-flex; align-items:center; gap:6px; background:#eaf3ff; border:1px solid #bcd6f7; color:#1b4f9c; border-radius:99px; padding:3px 6px 3px 11px; font-size:.82rem;}
  .rep-pastilla button{border:0; background:#cfe2fb; border-radius:50%; width:20px; height:20px; cursor:pointer; line-height:1;}
  .rep-link{border:0; background:none; color:#1b5fc4; cursor:pointer; text-decoration:underline; font:inherit;}
  .rep-chip.activa{border-color:#1f6feb; background:#eaf3ff; color:#1b5fc4; font-weight:600;}
  .rep-grupos{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-top:12px;}
  .rep-grupo{border:1px solid #e3e9f1; border-radius:10px; padding:10px 12px;}
  .rep-grupo h3{margin:0 0 6px; font-size:.86rem; font-family:var(--display); display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .rep-grupo h3 button{background:none; border:0; color:#1b5fc4; font:inherit; font-size:.76rem; cursor:pointer; padding:0;}
  .rep-grupo label{display:flex; gap:8px; align-items:flex-start; font-size:.86rem; padding:3px 0; cursor:pointer;}
  .rep-grupo input{margin-top:3px;}
  .rep-acciones{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .rep-tarjetas{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:14px 0;}
  .rep-aviso{padding:9px 12px; border-radius:9px; background:#fff8e1; border:1px solid #f2c94c; font-size:.84rem; margin:0 0 10px;}
  .rep-error{color:#b3261e; font-size:.9rem; padding:10px 0;}
  .rep-tabla{border-collapse:collapse; min-width:100%; font-size:.82rem;}
  .rep-tabla th, .rep-tabla td{padding:7px 10px; border-bottom:1px solid #e3e9f1; text-align:left; vertical-align:top;}
  .rep-tabla thead th{background:#f4f7fb; font-size:.72rem; text-transform:uppercase; letter-spacing:.02em; position:sticky; top:0; white-space:normal; min-width:90px;}
  .rep-tabla td.num, .rep-tabla th.num{text-align:right; font-family:var(--mono,"IBM Plex Mono",monospace);}
  .rep-tabla tfoot td{background:#eaf4ff; font-weight:700;}
  .rep-etq{display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:99px; white-space:nowrap;}
  .rep-etq.sin{background:#f1f3f6; color:#5b6b80;} .rep-etq.solo{background:#eaf3ff; color:#1b5fc4;} .rep-etq.comparte{background:#eaf9f2; color:#0f7a4c;}
  .rep-scroll{overflow:auto; max-height:68vh;}
</style>
</head>
<body class="planteles-page">
  <div id="shell"></div>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/inspecciones-reportes.js"></script>
</body>
</html>
