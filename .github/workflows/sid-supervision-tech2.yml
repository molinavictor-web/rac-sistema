name: SID Supervision Tech 2.0 - preflight
on:
  push:
    branches: [release/sid-supervision-tech2]
  pull_request:
    paths:
      - 'public/supervision/**'
      - 'public/css/sid-supervision-tech.css'
      - 'public/js/nav.js'
      - 'public/classroom.svg'
      - '.github/workflows/sid-supervision-tech2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript syntax
        run: node --check public/js/nav.js && node --check public/js/supervision-login.js
      - name: Verify 11 supervision pages and login form
        run: node --test tests/sid-supervision-tech2.test.js tests/sid-supervision-login.behavior.test.js tests/sid-supervision-permissions.test.js tests/sid-matricula-transaction.test.js

      - name: Install Chromium for isolated browser smoke test
        run: npm install --no-save --package-lock=false playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Verify responsive login in real browser
        run: node tests/sid-supervision-browser.cjs
